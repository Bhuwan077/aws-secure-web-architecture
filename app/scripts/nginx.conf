# Nginx reverse proxy configuration for AWS Secure Web Architecture
# Place in /etc/nginx/sites-available/expense-tracker and symlink to /etc/nginx/sites-enabled/

limit_req_zone $binary_remote_addr zone=app_limit:10m rate=15r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Explicitly block access to hidden files and SQLite database files
    location ~* \.(db|sqlite|sqlite3|env|git|sh|md)$ {
        deny all;
        return 404;
    }

    # Serve static assets directly with caching
    location /static/ {
        alias /opt/aws-secure-web-architecture/app/src/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Pass all application traffic to Gunicorn backend
    location / {
        limit_req zone=app_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint (bypasses rate limiting for CloudWatch/ALB)
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
}
